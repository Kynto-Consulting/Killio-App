[package]
name = "killio-app"
version = "0.1.0"
description = "Killio native shell"
edition = "2021"

[lib]
name = "killio_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable": several webviews in one window (the app's title bar above the page).
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-killio-device = { path = "plugins/device" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
base64 = "0.22"
ureq = "2"
sys-locale = "0.3.2"
tauri-plugin-deep-link = "2"
getrandom = "0.2"
tauri-plugin-notification = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "webp"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
xcap = "0.9.10"

# The dock icon follows the server (icon.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }
