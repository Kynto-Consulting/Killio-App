name: Build Killio App

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    # Every change to the app on main is built, tried on each system and published as app-latest.
    branches: [main]
    paths: ["src-tauri/**", "ui/**", "package.json", "package-lock.json", ".github/**"]

# A newer push replaces a build still in progress: only the newest one should publish.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# The build number the app carries and compares with the published one (update.rs).
env:
  KILLIO_BUILD: ${{ github.run_number }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
            args: --target universal-apple-darwin
          # 24.04: the screen-capture crate needs PipeWire newer than 22.04 ships.
          - os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: cargo test --lib
        working-directory: src-tauri
      - run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: killio-${{ matrix.os }}
          path: |
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm

      # ── Does it actually run? Start what was built, check it stays up, keep a picture of the screen. ──
      - name: Run it (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/smoke/windows.ps1
      - name: Run it (macOS)
        if: runner.os == 'macOS'
        run: bash .github/smoke/desktop.sh macos
      - name: Run it (Linux)
        if: runner.os == 'Linux'
        env:
          # No GPU on the runner: have WebKit draw in software.
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          sudo apt-get install -y xvfb imagemagick x11-utils dbus-x11
          # A session bus, as every Linux desktop has: the app uses it to stay a single instance.
          dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24" bash .github/smoke/desktop.sh linux
          # The frameless arrangement Windows and macOS use, to see whether it also works here. Informative only.
          KILLIO_FRAMELESS=1 dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24" bash .github/smoke/desktop.sh linux-frameless || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: smoke/

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner image already has the Android SDK (ANDROID_HOME) and an NDK.
      - name: Point Tauri at the NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # The Android project is generated, not committed, until it needs hand edits.
      - run: npx tauri android init
      # Microphone and camera (active listening, calls): the generated manifest only asks for the internet.
      - name: Add device permissions to the generated manifest
        run: |
          manifest=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          for permission in RECORD_AUDIO MODIFY_AUDIO_SETTINGS CAMERA; do
            grep -q "android.permission.$permission" "$manifest" ||
              sed -i "0,/<application/s//<uses-permission android:name=\"android.permission.$permission\" \/>\n    <application/" "$manifest"
          done
          grep -n "uses-permission" "$manifest"
      - run: npx tauri android build --apk
      # Always the same key, so each APK installs over the one before. The key is a repository secret.
      - name: Sign the APK with the app's own key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -exec ls -la {} +
          built="$(find src-tauri/gen/android/app/build/outputs/apk -name '*universal*.apk' | head -1)"
          [ -n "$built" ] || built="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/killio.p12"
          mkdir signed
          "$tools/zipalign" -f -p 4 "$built" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/killio.p12" --ks-type PKCS12 --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias killio --out signed/Killio-android.apk "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/killio.p12" "$RUNNER_TEMP/aligned.apk" signed/*.idsig
          "$tools/apksigner" verify --print-certs signed/Killio-android.apk | head -3
          ls -la signed
      - uses: actions/upload-artifact@v4
        with:
          name: killio-android
          path: signed/*.apk

  # ── Does it actually run? Install the APK on an Android emulator, open it, keep a picture of the screen.
  # Its own job on a clean machine: building four architectures leaves no disk space for an emulator.
  android-run:
    needs: [android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: killio-android
          path: apk
      # The emulator needs several GB for its own disk; the runner comes nearly full of tools this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk /usr/share/swift
          df -h / | tail -1
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run it (Android emulator)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_DIR: apk
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/smoke/android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-android
          path: smoke/

  # ── iOS: can the same app be built for an iPhone? Built for the simulator, which needs no Apple account.
  # Nothing depends on this job and nothing from it is published: an iPhone build people can install needs
  # an Apple Developer membership and its signing certificates.
  ios:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri ios init
      - name: Build for the simulator
        run: npx tauri ios build --target aarch64-sim --debug
      - name: Run it (iPhone simulator)
        run: bash .github/smoke/ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-ios
          path: smoke/

  # The installers people download. `app-latest` is a rolling release: it always holds the newest build
  # of main, and the download page of the frontend links to its files (through the frontend's own route,
  # since this repository is private).
  publish:
    needs: [desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the release notes list what changed since the last published build.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect the installers
        run: |
          mkdir release
          # One flat folder, stable names: Killio-<system>.<ext>
          find artifacts -type f \( -name '*-setup.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.apk' \) -print0 |
            while IFS= read -r -d '' file; do
              case "$file" in
                *-setup.exe) cp "$file" release/Killio-windows-setup.exe ;;
                *.msi)       cp "$file" release/Killio-windows.msi ;;
                *.dmg)       cp "$file" release/Killio-macos.dmg ;;
                *.AppImage)  cp "$file" release/Killio-linux.AppImage ;;
                *.deb)       cp "$file" release/Killio-linux.deb ;;
                *.rpm)       cp "$file" release/Killio-linux.rpm ;;
                *universal*.apk|*.apk) [ -e release/Killio-android.apk ] || cp "$file" release/Killio-android.apk ;;
              esac
            done
          ls -la release
          test -n "$(ls release)"
      - name: Publish as app-latest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          # What the app reads to offer an update: build number, changes since the last one, checksums.
          gh release download app-latest -p latest.json -O previous.json 2> /dev/null || true
          node .github/release-manifest.mjs release previous.json
          mv release/notes.md notes.md
          git tag -f app-latest "$GITHUB_SHA"
          git push -f origin app-latest
          if gh release view app-latest > /dev/null 2>&1; then
            gh release edit app-latest --title "Killio App $version (build $GITHUB_RUN_NUMBER)" --notes-file notes.md --prerelease=false
          else
            gh release create app-latest --title "Killio App $version (build $GITHUB_RUN_NUMBER)" --notes-file notes.md
          fi
          gh release upload app-latest release/* --clobber
